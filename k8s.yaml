apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core
  labels:
    app: iot-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-core
  template:
    metadata:
      labels:
        app: iot-core
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: iot-core
  labels:
    app: iot-core
spec:
  type: NodePort
  selector:
    app: iot-core
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30098
